<div class="login-container">
  <div class="login-card">
    <!-- Logo -->
    <div class="logo">
      <div class="logo-circle">
        <span class="star">✦</span>
      </div>
      <h1>NzolaNet</h1>
    </div>

    <h2>Bem-vindo de volta</h2>
    <p class="subtitle">Entra na tua conta NzolaNet</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="form-field">
        <label for="email">Email ou utilizador</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="demo@nzolanet.ao"
          autocomplete="email" />
      </div>

      <!-- Palavra-passe -->
      <div class="form-field">
        <label for="password">Palavra-passe</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password" />
      </div>
      
      <!-- Link Esqueceu a senha - AGORA AQUI -->
      <div class="forgot-password-container">
        <a routerLink="/recuperar-senha" class="forgot-link">Esqueceu a senha?</a>
      </div>
      
      <!-- Botão Entrar -->
      <button
        type="submit"
        class="btn-login"
        [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="isLoading" class="spinner"></span>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
          <polyline points="10 17 15 12 10 7" />
          <line x1="15" y1="12" x2="3" y2="12" />
        </svg>
        <span class="btn-text">Entrar</span>
      </button>
    </form>

    <!-- Link de Registo -->
    <div class="register-link">
      Ainda não tens conta?
      <a routerLink="/register">Regista-te</a>
    </div>
  </div>
</div>

<!-- MODAL DE ERRO -->
<div class="modal-overlay" *ngIf="showErrorModal" (click)="closeErrorModalOnBackdrop($event)">
  <div class="modal-content modal-error" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h3>{{ errorTitle }}</h3>
      <button class="modal-close" (click)="closeErrorModal()">✕</button>
    </div>
    <div class="modal-body">
      <p>{{ errorMessage }}</p>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-primary" (click)="closeErrorModal()">Entendi</button>
    </div>
  </div>
</div>
